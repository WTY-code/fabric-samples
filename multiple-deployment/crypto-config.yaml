OrdererOrgs:
  - Name: Orderer
    Domain: example.com
    Specs:
      - Hostname: orderer0
        # 添加机器1的公网IP作为SAN
        SANS:
          - "localhost"
          - "127.0.0.1"
          - "39.107.10.177"   # 机器1的公网IP
          - "orderer0"
          - "orderer0.example.com"
      - Hostname: orderer1
        SANS:
          - "localhost"
          - "127.0.0.1"
          - "39.107.10.177"   # 机器1的公网IP
          - "orderer1"
          - "orderer1.example.com"
      - Hostname: orderer2
        SANS:
          - "localhost"
          - "127.0.0.1"
          - "39.97.158.179"   # 机器2的公网IP
          - "orderer2"
          - "orderer2.example.com"
      - Hostname: orderer3
        SANS:
          - "localhost"
          - "127.0.0.1"
          - "39.97.158.179"   # 机器2的公网IP
          - "orderer3"
          - "orderer3.example.com"

PeerOrgs:
  - Name: Org1
    Domain: org1.example.com
    EnableNodeOUs: true
    Template:
      Count: 2
      # 为Org1的所有节点添加机器1的公网IP
      SANS:
        - "localhost"
        - "127.0.0.1"
        - "39.107.10.177"   # 机器1的公网IP
        - "peer0.org1.example.com"
        - "peer1.org1.example.com"
    Users:
      Count: 1
  - Name: Org2
    Domain: org2.example.com
    EnableNodeOUs: true
    Template:
      Count: 2
      # 为Org2的所有节点添加机器2的公网IP
      SANS:
        - "localhost"
        - "127.0.0.1"
        - "39.97.158.179"   # 机器2的公网IP
        - "peer0.org2.example.com"
        - "peer1.org2.example.com"
    Users:
      Count: 1